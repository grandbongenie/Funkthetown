<style type="text/css">

#video {
	display: none;
	width: 80%;
	max-width: 800px;
	height: 450px;
	margin: 20px auto;
}

@media screen and (max-width: 600px) {
	#video {
		width: 95%;
		height: 250px;
	}
}

@media screen and (max-width: 800px) and  (min-width: 600px){
	#video {
		width: 90%;
		height: 350px;
	}
}
</style>
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

<body data-nav-active="home">
	 <div class="containertop"></div>

	 <div class="animate__animated animate__flip"></div>

	 <!-- Vidéo YouTube intégrée -->
	 <iframe id="video" 
	         src="https://www.youtube.com/embed/3zWh11S7E-I?enablejsapi=1" 
	         frameborder="0" 
	         allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
	         allowfullscreen>
	 </iframe>

	 <div class="container2">
		<div class="animate__animated animate__slideInDown">
			<form action="/" method="post">
				<div class="email-box">
					<div>
						<div class="label">Join our Newsletter</div>	
						<i class="fas fa-envelope"></i>
						<input id="email" class="tbox" type="email" name="email" value="" placeholder="Email">
					</div>
					<button id="emailSend" class="btn" type="submit" name="submit">Join</button>
				</div>
			</form>
		</div>
	</div>

</body>

<script>
	$(document).ready(function() {
		$('.logo-img').on('click', function(){
			document.querySelector('#video').style.display="block";	
			// Pour YouTube iframe, on modifie le src pour autoplay
			var iframe = document.querySelector('#video');
			var src = iframe.src;
			if(src.indexOf('autoplay=1') === -1) {
				iframe.src = src + '&autoplay=1';
			}
		})
	});
</script>
