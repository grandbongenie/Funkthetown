<meta name="description" content="Funkthetown events video page." />

<body data-nav-active="events">
  <main class="events-page">
    <section class="events-stage" aria-label="Events video">
      <video id="eventsVideo" class="events-stage__video" autoplay loop playsinline preload="auto">
        <source src="Video/S%C3%A9quence%2001.web.mp4" type="video/mp4" />
      </video>
    </section>
  </main>

  <script src="js/navigation.js" defer></script>
  <script>
    (function () {
      var video = document.getElementById("eventsVideo");

      if (!video) {
        return;
      }

      video.muted = false;
      video.defaultMuted = false;
      video.volume = 1;

      function tryPlayWithSound() {
        var playPromise = video.play();

        if (playPromise && typeof playPromise.catch === "function") {
          playPromise.catch(function () {
            var resumeOnInteraction = function () {
              video.muted = false;
              video.defaultMuted = false;
              video.volume = 1;
              var resumePromise = video.play();
              if (resumePromise && typeof resumePromise.catch === "function") {
                resumePromise.catch(function () {});
              }
              document.removeEventListener("click", resumeOnInteraction);
              document.removeEventListener("touchstart", resumeOnInteraction);
              document.removeEventListener("keydown", resumeOnInteraction);
            };

            document.addEventListener("click", resumeOnInteraction, { once: true });
            document.addEventListener("touchstart", resumeOnInteraction, { once: true });
            document.addEventListener("keydown", resumeOnInteraction, { once: true });
          });
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", tryPlayWithSound, { once: true });
      } else {
        tryPlayWithSound();
      }
    })();
  </script>
</body>
</html>
