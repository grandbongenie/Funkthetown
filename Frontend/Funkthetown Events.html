  <div id="flyerViewer" class="flyer-viewer" hidden>
    <div class="flyer-viewer__backdrop" data-close></div>
    <div class="flyer-viewer__dialog" role="dialog" aria-modal="true" aria-labelledby="flyerViewerTitle">
      <button class="flyer-viewer__close" type="button" data-close aria-label="Fermer">&times;</button>
      <button class="flyer-viewer__nav flyer-viewer__nav--prev" type="button" aria-label="Flyer précédent">&#8249;</button>
      <div class="flyer-viewer__faces">
        <figure class="flyer-viewer__face"><img id="flyerViewerFront" alt="" /><figcaption>recto</figcaption></figure>
        <figure class="flyer-viewer__face" id="flyerViewerBackWrap"><img id="flyerViewerBack" alt="" /><figcaption>verso</figcaption></figure>
      </div>
      <button class="flyer-viewer__nav flyer-viewer__nav--next" type="button" aria-label="Flyer suivant">&#8250;</button>
      <p class="flyer-viewer__caption"><strong id="flyerViewerTitle"></strong> <span id="flyerViewerDate"></span></p>
    </div>
  </div>

  <script src="js/navigation.js" defer></script>
  <script>
    (function () {
      var video = document.getElementById("eventsVideo");

      if (!video) {
        return;
      }

      video.muted = false;
      video.defaultMuted = false;
      video.volume = 1;

      function tryPlayWithSound() {
        var playPromise = video.play();

        if (playPromise && typeof playPromise.catch === "function") {
          playPromise.catch(function () {
            var resumeOnInteraction = function () {
              video.muted = false;
              video.defaultMuted = false;
              video.volume = 1;
              var resumePromise = video.play();
              if (resumePromise && typeof resumePromise.catch === "function") {
                resumePromise.catch(function () {});
              }
              document.removeEventListener("click", resumeOnInteraction);
              document.removeEventListener("touchstart", resumeOnInteraction);
              document.removeEventListener("keydown", resumeOnInteraction);
            };

            document.addEventListener("click", resumeOnInteraction, { once: true });
            document.addEventListener("touchstart", resumeOnInteraction, { once: true });
            document.addEventListener("keydown", resumeOnInteraction, { once: true });
          });
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", tryPlayWithSound, { once: true });
      } else {
        tryPlayWithSound();
      }
    })();
  </script>
  <script>
    (function () {
      var cards = Array.prototype.slice.call(document.querySelectorAll(".flyer"));
      cards.sort(function (a, b) { return a.dataset.index - b.dataset.index; });
      var viewer = document.getElementById("flyerViewer");
      var front = document.getElementById("flyerViewerFront");
      var back = document.getElementById("flyerViewerBack");
      var backWrap = document.getElementById("flyerViewerBackWrap");
      var title = document.getElementById("flyerViewerTitle");
      var date = document.getElementById("flyerViewerDate");
      var current = 0;
      var lastFocus = null;

      function show(i) {
        current = (i + cards.length) % cards.length;
        var c = cards[current].dataset;
        front.src = c.front;
        front.alt = "Flyer " + c.title + " (recto)";
        if (c.back) {
          back.src = c.back;
          back.alt = "Flyer " + c.title + " (verso)";
          backWrap.hidden = false;
        } else {
          back.removeAttribute("src");
          backWrap.hidden = true;
        }
        title.textContent = c.title;
        date.textContent = c.date;
      }

      function open(i) {
        lastFocus = document.activeElement;
        show(i);
        viewer.hidden = false;
        document.body.classList.add("flyer-viewer-open");
        viewer.querySelector(".flyer-viewer__close").focus();
      }

      function close() {
        viewer.hidden = true;
        document.body.classList.remove("flyer-viewer-open");
        if (lastFocus) { lastFocus.focus(); }
      }

      cards.forEach(function (card, i) {
        card.addEventListener("click", function () { open(i); });
      });
      viewer.addEventListener("click", function (e) {
        if (e.target.hasAttribute("data-close")) { close(); }
      });
      viewer.querySelector(".flyer-viewer__nav--prev").addEventListener("click", function () { show(current - 1); });
      viewer.querySelector(".flyer-viewer__nav--next").addEventListener("click", function () { show(current + 1); });
      document.addEventListener("keydown", function (e) {
        if (viewer.hidden) { return; }
        if (e.key === "Escape") { close(); }
        if (e.key === "ArrowLeft") { show(current - 1); }
        if (e.key === "ArrowRight") { show(current + 1); }
      });
    })();
  </script>
