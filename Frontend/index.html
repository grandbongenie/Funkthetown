<script>
(function () {
	var introOverlay = document.getElementById("introOverlay");
	var introVideo = document.getElementById("introVideo");
	var introSoundButton = document.getElementById("introSoundButton");
	var homeAmbientAudio = document.getElementById("homeAmbientAudio");
	var skipIntroOnLoad = new URLSearchParams(window.location.search).get("skipIntro") === "1";
	var homeAudioEnabled = false;
	var introClosing = false;
	var homeAudioFadeFrame = null;
	var homeAudioRetryBound = false;
	var homeAudioLastStartAt = 0;

	if (!introOverlay || !introVideo || !introSoundButton) {
		return;
	}

	function startHomeAmbientAudio() {
		if (!homeAmbientAudio || !homeAudioEnabled) {
			return;
		}

		if (Date.now() - homeAudioLastStartAt < 1500) {
			return;
		}

		if (homeAudioFadeFrame) {
			window.cancelAnimationFrame(homeAudioFadeFrame);
			homeAudioFadeFrame = null;
		}

		homeAudioLastStartAt = Date.now();
		homeAmbientAudio.muted = false;
		homeAmbientAudio.volume = 1;
		homeAmbientAudio.play().catch(function () {
			homeAmbientAudio.muted = true;
			homeAmbientAudio.volume = 1;
		});
	}

	function restartHomeAmbientAudio(forcePlayback) {
		if (!homeAmbientAudio || (!homeAudioEnabled && !forcePlayback)) {
			return;
		}

		if (Date.now() - homeAudioLastStartAt < 1500) {
			return;
		}

		if (homeAudioFadeFrame) {
			window.cancelAnimationFrame(homeAudioFadeFrame);
			homeAudioFadeFrame = null;
		}

		homeAudioLastStartAt = Date.now();
		homeAmbientAudio.pause();
		homeAmbientAudio.currentTime = 0;
		homeAmbientAudio.muted = false;
		homeAmbientAudio.volume = 1;
		homeAmbientAudio.play().catch(function () {
			homeAmbientAudio.muted = true;
			homeAmbientAudio.volume = 1;
			bindHomeAudioRetry();
		});
	}

	function shouldReplayHomeAmbientAudio() {
		var homeIsVisible = document.body.classList.contains("home-ui-revealed");
		var introIsHidden = introOverlay.hasAttribute("hidden") || introOverlay.classList.contains("is-hidden");
		return homeIsVisible && introIsHidden;
	}

	function handleHomeAudioRetry() {
		if (!shouldReplayHomeAmbientAudio()) {
			return;
		}

		restartHomeAmbientAudio(true);
	}

	function bindHomeAudioRetry() {
		if (homeAudioRetryBound) {
			return;
		}

		homeAudioRetryBound = true;
		document.addEventListener("click", handleHomeAudioRetry, true);
		document.addEventListener("touchstart", handleHomeAudioRetry, true);
		document.addEventListener("pointerdown", handleHomeAudioRetry, true);
		document.addEventListener("keydown", handleHomeAudioRetry, true);
	}

	function showHomeWithoutIntro() {
		introClosing = true;
		introVideo.pause();
		introVideo.currentTime = 0;
		introVideo.muted = true;
		introOverlay.classList.add("is-hidden");
		introOverlay.setAttribute("hidden", "");
		document.body.classList.add("home-ui-revealed");

		if (homeAmbientAudio) {
			homeAmbientAudio.pause();
			homeAmbientAudio.currentTime = 0;
			homeAmbientAudio.muted = true;
			homeAmbientAudio.volume = 1;
		}

		window.setTimeout(function () {
			restartHomeAmbientAudio(true);
		}, 120);
	}

	function closeIntro() {
		if (introClosing) {
			return;
		}

		introClosing = true;
		introOverlay.classList.add("is-hidden");
		window.setTimeout(function () {
			startHomeAmbientAudio();
		}, 3000);
		window.setTimeout(function () {
			introOverlay.setAttribute("hidden", "");
			document.body.classList.add("home-ui-revealed");
		}, 6000);
	}

	function startWithSound() {
		homeAudioEnabled = true;
		introVideo.currentTime = 0;
		introVideo.muted = false;
		introVideo.volume = 1;
		introVideo.play().then(function () {
			introOverlay.classList.add("is-playing");
		}).catch(function () {
			introVideo.muted = true;
		});
	}

	function skipIntro() {
		introVideo.pause();
		introVideo.muted = true;
		closeIntro();
	}

	function isPortraitMobileIntro() {
		return window.matchMedia("(max-width: 900px) and (orientation: portrait)").matches;
	}

	introSoundButton.addEventListener("click", startWithSound);
	var introSkipButton = document.getElementById("introSkipButton");
	if (introSkipButton) {
		introSkipButton.addEventListener("click", function (event) {
			event.stopPropagation();
			homeAudioEnabled = true;
			skipIntro();
		});
	}
	introVideo.addEventListener("ended", closeIntro);
	introVideo.addEventListener("click", skipIntro);
	introOverlay.addEventListener("click", function (event) {
		if (!isPortraitMobileIntro()) {
			return;
		}

		if (event.target === introSoundButton || introSoundButton.contains(event.target)) {
			return;
		}

		skipIntro();
	});

	window.addEventListener("pageshow", function () {
		if (!shouldReplayHomeAmbientAudio()) {
			return;
		}

		restartHomeAmbientAudio(true);
	});

	document.addEventListener("visibilitychange", function () {
		if (document.visibilityState !== "visible" || !shouldReplayHomeAmbientAudio()) {
			return;
		}

		restartHomeAmbientAudio(true);
	});

	if (skipIntroOnLoad) {
		showHomeWithoutIntro();
	}
})();
</script>
